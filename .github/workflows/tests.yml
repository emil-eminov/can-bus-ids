name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -q
      - name: Demo on simulated drives
        run: |
          python simulate.py
          python -m canids train data/train.log -o data/baseline.json
          python -m canids detect data/clean_test.log -b data/baseline.json
          python -m canids detect data/attack.log -b data/baseline.json || test $? -eq 1
